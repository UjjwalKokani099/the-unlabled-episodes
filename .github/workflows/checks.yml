# Fast code checks on every push: static typing rule for game GDScript (tools/lint_typing.py).
name: Checks

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static typing lint
        run: python tools/lint_typing.py
